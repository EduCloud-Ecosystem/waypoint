name: Independent worker recovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y restic
      - run: pip install -r course-workspace/requirements-test.txt
      - run: python course-workspace/verify_recovery.py source --transfer "$RUNNER_TEMP/transfer"
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-encrypted-repository
          path: ${{ runner.temp }}/transfer
          retention-days: 1
          compression-level: 0
  replacement:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y restic
      - run: pip install -r course-workspace/requirements-test.txt
      - uses: actions/download-artifact@v4
        with:
          name: synthetic-encrypted-repository
          path: ${{ runner.temp }}/transfer
      - run: python course-workspace/verify_recovery.py target --transfer "$RUNNER_TEMP/transfer" --require-clean
