name: Synthetic course rehearsal
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'course-workspace/**'
      - '.github/workflows/course-rehearsal.yml'
permissions:
  contents: read
jobs:
  bridge:
    name: Saved-file bridge browser boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r course-workspace/course/requirements.txt
      - run: pip install -r course-workspace/rehearsal/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Real JupyterLab authentication, XSRF and popup boundary tests
        run: |
          python -c 'import jupyterlab, playwright'
          python -m unittest discover -s course-workspace/tests -p 'test_submission_bridge*.py' -v
  course:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/educloud-rehearsal-browsers
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: EduCloud-Ecosystem/cairn
          ref: 089911ece3783037d4f96ff0c9ca37e6907da320
          path: output/cairn-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: output/cairn-source/go.mod
          cache-dependency-path: output/cairn-source/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: output/cairn-source/web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y xfsprogs openssl restic
      - run: pip install -r course-workspace/rehearsal/requirements.txt
      - name: Rehearsal evidence, load and assessment tests
        run: |
          python -m unittest discover -s course-workspace/rehearsal -p 'test_*.py' -v
          python -m unittest discover -s course-workspace/tests -p test_course_load.py -v
      - run: python -m playwright install --with-deps chromium
      - name: Build instructor dashboard
        working-directory: output/cairn-source/web
        run: |
          npm ci
          npm run build
      - name: Build Cairn and the local LMS simulator
        working-directory: output/cairn-source
        run: |
          go build -o "$RUNNER_TEMP/cairn" ./cmd/cairn
          go build -o "$RUNNER_TEMP/lti-simulator" ./cmd/lti-simulator
      - name: Preload bounded checkout image
        working-directory: output/cairn-source
        run: docker build --pull -f Dockerfile.checkout -t cairn-checkout:local .
      - run: sudo --preserve-env=PLAYWRIGHT_BROWSERS_PATH "$(command -v python)" course-workspace/rehearsal/verify_course.py --cairn-binary "$RUNNER_TEMP/cairn" --lti-binary "$RUNNER_TEMP/lti-simulator" --cairn-source output/cairn-source --output /tmp/educloud-course-rehearsal --synthetic-candidate-images
      - name: Publish synthetic evidence only
        if: success()
        run: |
          mkdir -p output/rehearsal-evidence
          sudo cp /tmp/educloud-course-rehearsal/PASS.json output/rehearsal-evidence/
          sudo cp /tmp/educloud-course-rehearsal/course/instructor-modal-error.png output/rehearsal-evidence/
          sudo cp /tmp/educloud-course-rehearsal/course/instructor-dashboard.png output/rehearsal-evidence/
          sudo cp /tmp/educloud-course-rehearsal/course/alice-reviewed-feedback.png output/rehearsal-evidence/
          sudo cp /tmp/educloud-course-rehearsal/course/bob-reviewed-feedback.png output/rehearsal-evidence/
          sudo cp /tmp/educloud-course-rehearsal/course/student-workspace-link.png output/rehearsal-evidence/
          sudo cp /tmp/educloud-course-rehearsal/course/student-grade.png output/rehearsal-evidence/
          sudo cp /tmp/educloud-course-rehearsal/course/submission-preview.png output/rehearsal-evidence/
          sudo cp /tmp/educloud-course-rehearsal/course/submission-receipt.png output/rehearsal-evidence/
          sudo cp /tmp/educloud-course-rehearsal/notebook/notebook.png output/rehearsal-evidence/
          sudo chmod 644 output/rehearsal-evidence/*
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: synthetic-course-evidence
          path: output/rehearsal-evidence
          if-no-files-found: error
          retention-days: 7
      - name: Exercise reviewed upgrade and fresh-destination recovery
        run: sudo --preserve-env=PLAYWRIGHT_BROWSERS_PATH "$(command -v python)" course-workspace/rehearsal/verify_upgrade.py --canary /tmp/educloud-course-rehearsal/PASS.json --output /tmp/educloud-upgrade-rehearsal
      - name: Publish bounded upgrade evidence
        if: success()
        run: |
          mkdir -p output/upgrade-evidence
          sudo cp /tmp/educloud-upgrade-rehearsal/UPGRADE-PASS.json /tmp/educloud-upgrade-rehearsal/upgraded-notebook.png /tmp/educloud-upgrade-rehearsal/recovered-notebook.png output/upgrade-evidence/
          sudo chmod 644 output/upgrade-evidence/*
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: synthetic-upgrade-evidence
          path: output/upgrade-evidence
          if-no-files-found: error
          retention-days: 7
      - name: Exercise retired-course export and protected recovery
        run: sudo --preserve-env=PLAYWRIGHT_BROWSERS_PATH "$(command -v python)" course-workspace/rehearsal/verify_retirement.py --output /tmp/educloud-retirement-rehearsal
      - name: Publish bounded retirement evidence
        if: success()
        run: |
          mkdir -p output/retirement-evidence
          sudo cp /tmp/educloud-retirement-rehearsal/RETIREMENT-PASS.json output/retirement-evidence/
          sudo chmod 644 output/retirement-evidence/RETIREMENT-PASS.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: synthetic-retirement-evidence
          path: output/retirement-evidence
          if-no-files-found: error
          retention-days: 7
      - name: Exercise two-course allocation and failure isolation
        run: sudo --preserve-env=PLAYWRIGHT_BROWSERS_PATH "$(command -v python)" course-workspace/rehearsal/verify_multiple_courses.py --output /tmp/educloud-multiple-course-rehearsal
      - name: Publish bounded multiple-course evidence
        if: success()
        run: |
          mkdir -p output/multiple-course-evidence
          sudo cp /tmp/educloud-multiple-course-rehearsal/MULTI-COURSE-PASS.json output/multiple-course-evidence/
          sudo chmod 644 output/multiple-course-evidence/MULTI-COURSE-PASS.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: synthetic-multiple-course-evidence
          path: output/multiple-course-evidence
          if-no-files-found: error
          retention-days: 7
      - name: Preserve bounded synthetic browser diagnostic on failure
        if: failure()
        run: |
          mkdir -p output/rehearsal-diagnostic
          if sudo test -f /tmp/educloud-course-rehearsal/notebook/notebook.png; then
            sudo cp /tmp/educloud-course-rehearsal/notebook/notebook.png output/rehearsal-diagnostic/
            sudo chmod 644 output/rehearsal-diagnostic/notebook.png
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-course-diagnostic-not-acceptance
          path: output/rehearsal-diagnostic
          if-no-files-found: ignore
          retention-days: 7
