name: Hard home quotas
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'course-workspace/recovery.py'
      - 'course-workspace/backup.py'
      - 'course-workspace/checkpoint.py'
      - 'course-workspace/deployment.py'
      - 'course-workspace/homes.py'
      - 'course-workspace/hub/**'
      - 'course-workspace/quota-compose.yaml'
      - 'course-workspace/verify_quotas.py'
      - '.github/workflows/workspace-quotas.yml'
permissions:
  contents: read
jobs:
  quotas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xfsprogs restic
      - run: pip install -r course-workspace/requirements-test.txt
      - run: sudo "$(command -v python)" course-workspace/verify_quotas.py
