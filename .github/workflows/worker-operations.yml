name: Worker operations
on:
  pull_request:
    paths: ['course-workspace/**', '.github/workflows/worker-operations.yml']
  push:
    branches: [main]
    paths: ['course-workspace/**', '.github/workflows/worker-operations.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-worker-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rehearse authenticated independent worker control locally
        run: python course-workspace/rehearsal/verify_remote_workers.py --output /tmp/educloud-independent-workers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-independent-worker-evidence
          path: /tmp/educloud-independent-workers/REMOTE-WORKERS-*.json
          if-no-files-found: error
          retention-days: 7
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xfsprogs
      - run: sudo "$(command -v python)" course-workspace/verify_maintenance.py --output /tmp/educloud-maintenance
      - name: Export bounded synthetic maintenance evidence
        run: |
          mkdir -p output/maintenance-evidence
          sudo cp /tmp/educloud-maintenance/PASS.json output/maintenance-evidence/
          sudo chmod 644 output/maintenance-evidence/PASS.json
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-maintenance-evidence
          path: output/maintenance-evidence/PASS.json
          retention-days: 7
