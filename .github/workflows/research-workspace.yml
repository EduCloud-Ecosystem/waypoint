name: Research workspace
on:
  pull_request:
    paths: ['research-workspace/**', '.github/workflows/research-workspace.yml']
  push:
    branches: [main]
    paths: ['research-workspace/**', '.github/workflows/research-workspace.yml']
  workflow_dispatch:
    inputs:
      clean_source_builds:
        description: 'Run bounded native AMD64 source builds and full synthetic qualification'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research-workspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install distro binary R for mandatory candidate controls
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/owned-peer-evidence"
          mkdir -p "$evidence"
          cp /etc/os-release "$evidence/streaming-r-distro.txt"
          finish() {
            code=$?
            trap - EXIT
            if ! timeout --signal=TERM --kill-after=5s 10s \
              dpkg-query --show --showformat='${Package}\t${Version}\t${Architecture}\n' \
              r-base-core > "$evidence/streaming-r-installed-package.txt" 2>&1; then
              if [ "$code" -eq 0 ]; then code=1; fi
            fi
            printf '{"exit_code":%s,"package":"r-base-core","source":"runner distro binary package","runtime_attestation":false}\n' \
              "$code" > "$evidence/streaming-r-package-install.json"
            exit "$code"
          }
          trap finish EXIT
          timeout --signal=TERM --kill-after=10s 90s \
            sudo env DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=1 -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 update \
              2>&1 | tee "$evidence/streaming-r-apt-update.log"
          timeout --signal=TERM --kill-after=5s 10s \
            apt-cache policy r-base-core \
              2>&1 | tee "$evidence/streaming-r-package-candidate.txt"
          timeout --signal=TERM --kill-after=10s 150s \
            sudo env DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=1 -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 --yes --no-install-recommends \
              install r-base-core \
              2>&1 | tee "$evidence/streaming-r-apt-install.log"
      - name: Verify CI-installed distro R and record candidate interpreter provenance
        run: |
          python - <<'PY'
          import hashlib, json, os, platform, selectors, shutil, subprocess, time
          from pathlib import Path
          evidence = Path(os.environ['RUNNER_TEMP'])/'owned-peer-evidence'
          evidence.mkdir(parents=True, exist_ok=True)
          value = {'status':'FAIL','R_candidate_runtime':'NOT RUN',
              'platform':platform.platform(),'path':shutil.which('Rscript'),
              'resolved_path':None,'frontend_sha256':None,'version':None,
              'failure':'RSCRIPT_UNAVAILABLE',
              'boundary':'CI-installed distro interpreter preflight and package-version provenance only; no immutable runtime, image, source-build, capacity or cleanup qualification.'}
          if value['path']:
              try:
                  path = Path(value['path']).resolve(strict=True)
                  digest = hashlib.sha256()
                  with path.open('rb') as source:
                      while block := source.read(65536):
                          digest.update(block)
                  value.update(resolved_path=str(path),frontend_sha256=digest.hexdigest())
                  process = subprocess.Popen([value['path'],'--version'],
                      stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
                  selector = selectors.DefaultSelector()
                  output = bytearray()
                  deadline = time.monotonic()+10
                  try:
                      os.set_blocking(process.stdout.fileno(),False)
                      selector.register(process.stdout,selectors.EVENT_READ)
                      while selector.get_map():
                          if time.monotonic()>=deadline:
                              raise RuntimeError('RSCRIPT_VERSION_TIMEOUT')
                          for key,_ in selector.select(0.1):
                              try:
                                  block=os.read(key.fd,4096)
                              except BlockingIOError:
                                  continue
                              if not block:
                                  selector.unregister(key.fileobj)
                              else:
                                  if len(output)+len(block)>4096:
                                      raise RuntimeError('RSCRIPT_VERSION_OUTPUT_BOUND')
                                  output.extend(block)
                      code=process.wait(timeout=max(0.01,deadline-time.monotonic()))
                      value.update(version=bytes(output).decode('utf-8','replace').strip(),exit_code=code)
                      if code!=0:
                          raise RuntimeError('RSCRIPT_VERSION_FAILED')
                      value.update(status='PASS',failure=None)
                  finally:
                      selector.close()
                      if process.poll() is None:
                          process.kill()
                      process.wait(timeout=5)
                      process.stdout.close()
              except Exception as error:
                  allowed={'RSCRIPT_VERSION_TIMEOUT','RSCRIPT_VERSION_OUTPUT_BOUND','RSCRIPT_VERSION_FAILED'}
                  value['failure']=str(error) if str(error) in allowed else 'RSCRIPT_PREFLIGHT_UNAVAILABLE'
          (evidence/'streaming-r-preflight.json').write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
          if value['status']!='PASS':
              raise SystemExit(value['failure'])
          PY
      - name: Checkout accepted synthetic owned-data helper source
        uses: actions/checkout@v4
        with:
          repository: EduCloud-Ecosystem/outfitter
          ref: 8584ca8db9a7e5eaf8d29d9670349b57f3939ab6
          path: .ci-outfitter-owned
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Build only synthetic peer helpers and record Linux provenance
        working-directory: .ci-outfitter-owned
        env:
          GOMAXPROCS: '2'
          GOFLAGS: '-p=1'
        run: |
          set -o pipefail
          test "$(git rev-parse HEAD)" = 8584ca8db9a7e5eaf8d29d9670349b57f3939ab6
          mkdir -p "$RUNNER_TEMP/owned-peer-assets" "$RUNNER_TEMP/owned-peer-evidence"
          go test -c -o "$RUNNER_TEMP/owned-peer-assets/broker.test" ./internal/broker 2>&1 | tee "$RUNNER_TEMP/owned-peer-evidence/build-broker.log"
          go test -c -o "$RUNNER_TEMP/owned-peer-assets/ledger.test" ./internal/ledger 2>&1 | tee "$RUNNER_TEMP/owned-peer-evidence/build-ledger.log"
          python - <<'PY'
          import hashlib, json, os, platform, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          files = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          source = {name:digest(Path(name)) for name in files if name and (name.endswith('.go') or name in {'go.mod','go.sum'})}
          assets = Path(os.environ['RUNNER_TEMP'])/'owned-peer-assets'
          evidence = Path(os.environ['RUNNER_TEMP'])/'owned-peer-evidence'
          if git('status','--porcelain'):
              raise SystemExit('helper source changed during build')
          value = {'source_head':git('rev-parse','HEAD'),'source_tree':git('rev-parse','HEAD^{tree}'),
              'source_sha256':source,'platform':platform.platform(),
              'go_version':subprocess.check_output(['go','version']).decode().strip(),
              'commands':['go test -c -o broker.test ./internal/broker','go test -c -o ledger.test ./internal/ledger'],
              'environment':{'GOMAXPROCS':'2','GOFLAGS':'-p=1'},
              'helper_sha256':{p.name:digest(p) for p in assets.iterdir()},
              'boundary':'New hosted Linux synthetic helper builds; not the archived Darwin 4de6a090 binaries. No engine, provider, compute grant or trusted cleanup.'}
          (evidence/'helper-build.json').write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
          PY
      - name: Run controls including the actual connected synthetic peer
        env:
          WAYPOINT_OWNED_PEER_ASSETS: ${{ runner.temp }}/owned-peer-assets
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -o pipefail
          python -W error::ResourceWarning -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/owned-peer-evidence/controls.log"
      - name: Retain helper source binding and control output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-synthetic-peer-controls
          if-no-files-found: warn
          retention-days: 14
          path: ${{ runner.temp }}/owned-peer-evidence/
      - run: node --check static/app.js
      - name: Install optional PDF verification dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-pdf.txt
      - name: Fetch pinned Computer Modern test font
        run: |
          curl --fail --silent --show-error --proto '=https' --max-time 30 --max-filesize 65536 \
            https://raw.githubusercontent.com/matplotlib/matplotlib/4aeb773422464799998d900198b35cb80e94b3e1/lib/matplotlib/mpl-data/fonts/ttf/cmr10.ttf \
            --output "$RUNNER_TEMP/assessment-cmr10.ttf"
          echo "4dd9761b058c009db9b2145f55ee6617d093c273dd3d6c5b3e43ff6110fa9bf6  $RUNNER_TEMP/assessment-cmr10.ttf" | sha256sum --check --strict
      - name: Verify local draft export PDFs and real CLI boundaries
        run: ASSESSMENT_EXPORT_FONT="$RUNNER_TEMP/assessment-cmr10.ttf" python -W error::ResourceWarning -m unittest discover -s tests_pdf -v

  actual-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: waypoint
      - uses: actions/checkout@v4
        with:
          repository: EduCloud-Ecosystem/outfitter
          ref: 5446438985e31cb739f2048a2aa2176918831a7e
          path: outfitter
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - run: go build -o bin/outfitter ./cmd/outfitter
        working-directory: outfitter
      - name: Pull reviewed immutable runtimes
        run: |
          docker pull python@sha256:229a2c5bfa27522db7815ea81f9bed70af17ccb9de9fc7ad142b1877b5830d36
          docker pull r-base@sha256:fa1972f31def171b83e0911e947ab8b57db143f0fc8a67af4c0d5ac329041646
      - name: Exercise HTTP, authorization, Docker, accounting and export
        working-directory: waypoint/research-workspace
        run: |
          python verify.py \
            --broker "$GITHUB_WORKSPACE/outfitter/bin/outfitter" \
            --python-image python@sha256:229a2c5bfa27522db7815ea81f9bed70af17ccb9de9fc7ad142b1877b5830d36 \
            --r-image r-base@sha256:fa1972f31def171b83e0911e947ab8b57db143f0fc8a67af4c0d5ac329041646 \
            --output "$RUNNER_TEMP/research-acceptance"
      - name: Reproduce verified historical browser evidence
        working-directory: waypoint/research-workspace
        run: |
          python -m research_workspace reproduce evidence/2026-10-17/browser-evidence.zip \
            --trusted-sha256 888bbb96e611e6ba4a9b6181b2d8a1b314ac6167bf39d2642fb2e8c07ab20d87 \
            --broker "$GITHUB_WORKSPACE/outfitter/bin/outfitter" \
            --budget-cpu-seconds 60 --output "$RUNNER_TEMP/reproduction-acceptance"
          python -c 'import json,os; from pathlib import Path; assert json.loads((Path(os.environ["RUNNER_TEMP"])/"reproduction-acceptance/report.json").read_text())["status"] == "PASS"'
      - name: Exercise coordinated local replacement and failed cutover
        working-directory: waypoint/research-workspace
        run: |
          python verify_recovery.py --broker "$GITHUB_WORKSPACE/outfitter/bin/outfitter" \
            --output "$RUNNER_TEMP/recovery-acceptance"
      - name: Exercise guarded dispatch and versioned recovery
        working-directory: waypoint/research-workspace
        run: |
          python verify_guard_provider.py --broker "$GITHUB_WORKSPACE/outfitter/bin/outfitter" \
            --output "$RUNNER_TEMP/operation-guard-acceptance"
      - name: Retain only public synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-public-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/research-acceptance/verification.json
            ${{ runner.temp }}/research-acceptance/first-project.zip
            ${{ runner.temp }}/research-acceptance/second-project.zip
            ${{ runner.temp }}/reproduction-acceptance/report.json
            ${{ runner.temp }}/reproduction-acceptance/evidence.zip
            ${{ runner.temp }}/recovery-acceptance/verification.json
            ${{ runner.temp }}/recovery-acceptance/before.zip
            ${{ runner.temp }}/recovery-acceptance/after.zip
            ${{ runner.temp }}/operation-guard-acceptance/verification.json
  clean-source-builds:
    if: github.event_name == 'workflow_dispatch' && inputs.clean_source_builds
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          path: waypoint
      - uses: actions/checkout@v4
        with:
          repository: EduCloud-Ecosystem/outfitter
          ref: 5827c84e9952cc67b85e91ceff4282e0ead6923b
          path: outfitter
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - run: go build -o bin/outfitter ./cmd/outfitter
        working-directory: outfitter
      - name: Clean native source builds with finite dedicated capacity
        working-directory: waypoint/research-workspace
        run: python build_sources.py --platform linux/amd64 --output "$RUNNER_TEMP/source-builds"
      - name: Both conditions and runtimes across two projects
        working-directory: waypoint/research-workspace
        run: |
          python qualify_sources.py --builds "$RUNNER_TEMP/source-builds/builds.json" \
            --broker "$GITHUB_WORKSPACE/outfitter/bin/outfitter" --output "$RUNNER_TEMP/source-qualification"
      - name: Retain successful and failed source-build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-source-build-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/source-builds/builds.json
            ${{ runner.temp }}/source-builds/builder.log
            ${{ runner.temp }}/source-builds/*/build.json
            ${{ runner.temp }}/source-builds/*/build.log
            ${{ runner.temp }}/source-builds/*/metadata.json
            ${{ runner.temp }}/source-builds/*/packages.tsv
            ${{ runner.temp }}/source-builds/*/configure.log
            ${{ runner.temp }}/source-builds/*/config.log
            ${{ runner.temp }}/source-qualification/qualification.json
            ${{ runner.temp }}/source-qualification/*/candidates.json
            ${{ runner.temp }}/source-qualification/*/qualification.log
            ${{ runner.temp }}/source-qualification/*/qualification/verification.json
            ${{ runner.temp }}/source-qualification/*/qualification/first-project.zip
            ${{ runner.temp }}/source-qualification/*/qualification/second-project.zip
