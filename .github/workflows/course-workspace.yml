name: Course workspace
on:
  pull_request:
    paths: ['course-workspace/**', '.github/workflows/course-workspace.yml']
  push:
    branches: [main]
    paths: ['course-workspace/**', '.github/workflows/course-workspace.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r course-workspace/requirements-test.txt
      - run: python -m unittest discover -s course-workspace/tests -v
  operator-source-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the operator source release
        run: |
          python course-workspace/classroom/release_browser_bundle.py \
            --version v0.0.0-rc.1 --out "$RUNNER_TEMP/waypoint-operator-release"
      - name: Verify the artifacts and test the extracted tool
        working-directory: ${{ runner.temp }}/waypoint-operator-release
        run: |
          sha256sum --check SHA256SUMS
          unzip -q waypoint-browser-bundle-v0.0.0-rc.1.zip
          python -m unittest discover \
            -s waypoint-browser-bundle/course-workspace/tests -p test_browser_bundle.py -v
      - name: Validate SPDX 2.3
        working-directory: ${{ runner.temp }}/waypoint-operator-release
        run: |
          python -m pip install spdx-tools==0.8.5
          pyspdxtools -i waypoint-browser-bundle-v0.0.0-rc.1.spdx.json
  https-configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y nginx openssl
      - run: python course-workspace/verify_https.py
  continuity:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r course-workspace/requirements-test.txt
      - run: sudo "$(command -v python)" course-workspace/verify.py
      - run: sudo "$(command -v python)" course-workspace/verify_pilot.py
