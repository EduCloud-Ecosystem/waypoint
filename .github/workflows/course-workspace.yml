name: Course workspace
on:
  pull_request:
    paths: ['course-workspace/**', '.github/workflows/course-workspace.yml']
  push:
    branches: [main]
    paths: ['course-workspace/**', '.github/workflows/course-workspace.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s course-workspace/tests -v
  continuity:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r course-workspace/requirements-test.txt
      - run: python course-workspace/verify.py
