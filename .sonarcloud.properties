# SonarQube Cloud automatic analysis; do not add a second CI scanner.
# The Sonar quality gate remains advisory in GitHub.
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Explicit, disjoint source/test classification; tests remain analyzed.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=course-workspace/tests/**,research-workspace/tests/**,research-workspace/tests_pdf/**,**/test_*.py,**/*_test.py,**/conftest.py,**/*.test.js,**/*.test.cjs,**/*.test.mjs,**/*.test.ts,course-workspace/verify_*.py,course-workspace/rehearsal/verify_*.py,research-workspace/verify_*.py,course-workspace/rehearsal/studio_controls.py
# Mirror test patterns so no file is indexed as both source and test.
sonar.exclusions=course-workspace/tests/**,research-workspace/tests/**,research-workspace/tests_pdf/**,**/test_*.py,**/*_test.py,**/conftest.py,**/*.test.js,**/*.test.cjs,**/*.test.mjs,**/*.test.ts,course-workspace/verify_*.py,course-workspace/rehearsal/verify_*.py,research-workspace/verify_*.py,course-workspace/rehearsal/studio_controls.py
