<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NHANES notebook | Waypoint</title>
  <link rel="stylesheet" href="./notebook.css">
  <script type="module" src="./notebook.js"></script>
</head>
<body>
  <header>
    <div class="page-width">
      <p class="brand">Waypoint</p>
      <h1>NHANES notebook</h1>
      <nav aria-label="Notebook links">
        <a href="#cell-6">Go to solution</a>
        <a href="#coursework">Go to downloads</a>
        <a href="../files/nhanes-wrangling.ipynb" download>Download original notebook</a>
        <span id="fallback">Hosted fallback</span>
      </nav>
    </div>
  </header>
  <main class="page-width">
    <section aria-labelledby="cells">
      <h2 id="cells" tabindex="-1">Notebook cells</h2>
      <div class="actions">
        <button id="run" disabled>Run all cells</button>
        <button id="stop" hidden>Stop run</button>
        <button id="save" disabled>Save on this device</button>
      </div>
      <p id="status" role="status">Opening the notebook…</p>
      <div id="notebook"></div>
    </section>
    <section aria-labelledby="coursework">
      <h2 id="coursework" tabindex="-1">Coursework and downloads</h2>
      <p>Download copies before leaving. Submit through your course’s usual workflow.</p>
      <div id="files"></div>
      <p id="download-status" role="status"></p>
    </section>
  </main>
</body>
</html>
